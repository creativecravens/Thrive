<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private page</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style id="app-style">
:root {
  --blue: #1E5AA8;
  --green: #1F8A5B;
  --orange: #F07A1A;
  --on-blue: #FFFFFF;
  --on-green: #FFFFFF;
  --on-orange: #1F2328;
  --primary: var(--blue);
  --on-primary: var(--on-blue);
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --ink: #1F2328;
  --muted: #56606B;
  --line: #DCE2E9;
  --accent-text: #1E5AA8;
  --display: "Logo Code", "LogoCode", "Logo Code Regular", "Orbitron", "Arial Black", system-ui, sans-serif;
  --text: "Lato", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --head-weight: 900;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161B;
    --surface: #1B2027;
    --ink: #E8ECF1;
    --muted: #A3ADB9;
    --line: #2C333C;
    --accent-text: #F07A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161B;
  --surface: #1B2027;
  --ink: #E8ECF1;
  --muted: #A3ADB9;
  --line: #2C333C;
  --accent-text: #F07A1A;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 1.125rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 8rem; }


/* type scale */
h1, h2, h3 { font-family: var(--display); margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.3rem, 8vw, 4.6rem); font-weight: var(--head-weight); line-height: 1.02; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.45rem, 4.6vw, 2.2rem); font-weight: var(--head-weight); line-height: 1.1; }
h3 { font-size: 1rem; font-weight: 700; line-height: 1.3; color: var(--accent-text); margin: 2rem 0 .4rem; }
.kicker { font-weight: 300; font-style: italic; font-size: 1.15rem; color: var(--muted); margin-top: .4rem; }
.sec-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 1rem; margin-bottom: 1.25rem; padding-bottom: .9rem; border-bottom: 4px solid var(--primary); }
.sec-count { font-family: var(--display); font-weight: var(--head-weight); font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1; color: var(--ink); text-align: right; }
.sec-count small { display: block; font-family: var(--text); font-weight: 700; font-size: .85rem; color: var(--muted); margin-top: .3rem; }

/* hero */
.date { font-weight: 700; font-size: 1rem; color: var(--accent-text); margin-bottom: .9rem; }
.intro { margin-top: 1.25rem; font-size: clamp(1.2rem, 3vw, 1.45rem); font-weight: 300; line-height: 1.45; max-width: 38rem; }
.reminder { margin-top: 2rem; padding: 1.25rem 1.4rem 1.35rem; background: var(--blue); color: var(--on-blue); border-radius: 16px; }
.reminder-label { display: block; font-weight: 700; font-size: .95rem; opacity: .9; }
.reminder-text { display: block; margin-top: .25rem; font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 1.7rem); line-height: 1.3; }
.countdown { display: inline-block; margin-top: 1rem; padding: .35rem .9rem; border-radius: 999px; background: var(--orange); color: var(--on-orange); font-weight: 900; }

section { margin-top: 4rem; }

/* lock screen */
.lock { min-height: 78vh; max-width: 28rem; margin: 0 auto; display: grid; align-content: center; gap: 1.1rem; }
.lock-icon { width: 3.5rem; height: 3.5rem; }
.lock-title { font-size: clamp(1.9rem, 6.5vw, 2.7rem); font-weight: var(--head-weight); line-height: 1.08; }
.lock-lede { font-size: 1.2rem; font-weight: 300; line-height: 1.45; }
.lock-field { display: grid; gap: .35rem; }
.lock-field span { font-weight: 700; font-size: .95rem; color: var(--muted); }
.lock-field input { font: inherit; font-size: 1.15rem; min-height: 3.1rem; padding: 0 1rem; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: 100%; }
.lock-field input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
.lock-show { display: flex; align-items: center; gap: .6rem; font-size: 1rem; cursor: pointer; }
.lock-show input { width: 1.2rem; height: 1.2rem; accent-color: var(--blue); }
.lock-hint { color: var(--muted); font-size: 1rem; line-height: 1.5; }
.lock-btn { font: inherit; font-size: 1.1rem; font-weight: 900; min-height: 3.2rem; border: 0; border-radius: 12px; background: var(--blue); color: var(--on-blue); cursor: pointer; }
.lock-btn[disabled] { opacity: .7; cursor: progress; }
.lock-error { padding: .7rem .9rem; border-left: 5px solid var(--orange); border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--orange) 15%, transparent); font-weight: 700; }

/* after setup */
.banner { margin-bottom: 2.5rem; padding: 1.25rem 1.4rem; border-radius: 16px; background: var(--green); color: var(--on-green); display: grid; gap: .75rem; }
.banner strong { font-family: var(--display); font-weight: var(--head-weight); font-size: 1.25rem; line-height: 1.2; }
.banner button { justify-self: start; font: inherit; font-weight: 900; padding: .5rem 1.1rem; border-radius: 10px; border: 2px solid var(--on-green); background: transparent; color: var(--on-green); cursor: pointer; }

/* floating buttons */
.fab-row { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: .5rem; }
.fab-row .edit-fab { position: static; }
.lock-fab { font: inherit; font-weight: 900; font-size: 1rem; padding: .8rem 1.2rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* flamingos */
body { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22 viewBox=%220 0 300 300%22%3E%3Cg transform=%22translate(18 22) scale(0.9)%22 opacity=%220.09%22%3E%3Cpath d=%22M24 60 L24 77 M20 77 L28 77%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M26 60 L33 66 L25 69%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M8 46 C8 36 22 32 32 36 C40 39 44 46 40 53 C36 60 22 62 14 56 C10 53 8 50 8 46 Z M4 44 L12 46 L8 52 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M14 44 C20 40 30 41 34 47 C28 50 20 51 14 44 Z%22 fill=%22%23FFFFFF%22 fill-opacity=%22.35%22/%3E%3Cpath d=%22M37 40 C46 32 46 24 40 18 C35 13 36 6 43 5%22 stroke=%22%23F7709F%22 stroke-width=%225%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Ccircle cx=%2245%22 cy=%227%22 r=%225%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M48 5 C54 4 58 7 57 13 C55 11 52 10 49 11 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M55.5 9.5 C57.5 11 57.6 13 57 15 C56 13.3 55 12.5 54 12 Z%22 fill=%22%231F2328%22/%3E%3Ccircle cx=%2245.5%22 cy=%226%22 r=%221.2%22 fill=%22%231F2328%22/%3E%3C/g%3E%3Cg transform=%22translate(190 120) scale(0.65) translate(64 0) scale(-1 1)%22 opacity=%220.09%22%3E%3Cpath d=%22M24 60 L24 77 M20 77 L28 77%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M26 60 L33 66 L25 69%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M8 46 C8 36 22 32 32 36 C40 39 44 46 40 53 C36 60 22 62 14 56 C10 53 8 50 8 46 Z M4 44 L12 46 L8 52 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M14 44 C20 40 30 41 34 47 C28 50 20 51 14 44 Z%22 fill=%22%23FFFFFF%22 fill-opacity=%22.35%22/%3E%3Cpath d=%22M37 40 C46 32 46 24 40 18 C35 13 36 6 43 5%22 stroke=%22%23F7709F%22 stroke-width=%225%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Ccircle cx=%2245%22 cy=%227%22 r=%225%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M48 5 C54 4 58 7 57 13 C55 11 52 10 49 11 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M55.5 9.5 C57.5 11 57.6 13 57 15 C56 13.3 55 12.5 54 12 Z%22 fill=%22%231F2328%22/%3E%3Ccircle cx=%2245.5%22 cy=%226%22 r=%221.2%22 fill=%22%231F2328%22/%3E%3C/g%3E%3Cg transform=%22translate(70 205) scale(0.5)%22 opacity=%220.09%22%3E%3Cpath d=%22M24 60 L24 77 M20 77 L28 77%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M26 60 L33 66 L25 69%22 stroke=%22%23F7709F%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/%3E%3Cpath d=%22M8 46 C8 36 22 32 32 36 C40 39 44 46 40 53 C36 60 22 62 14 56 C10 53 8 50 8 46 Z M4 44 L12 46 L8 52 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M14 44 C20 40 30 41 34 47 C28 50 20 51 14 44 Z%22 fill=%22%23FFFFFF%22 fill-opacity=%22.35%22/%3E%3Cpath d=%22M37 40 C46 32 46 24 40 18 C35 13 36 6 43 5%22 stroke=%22%23F7709F%22 stroke-width=%225%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Ccircle cx=%2245%22 cy=%227%22 r=%225%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M48 5 C54 4 58 7 57 13 C55 11 52 10 49 11 Z%22 fill=%22%23F7709F%22/%3E%3Cpath d=%22M55.5 9.5 C57.5 11 57.6 13 57 15 C56 13.3 55 12.5 54 12 Z%22 fill=%22%231F2328%22/%3E%3Ccircle cx=%2245.5%22 cy=%226%22 r=%221.2%22 fill=%22%231F2328%22/%3E%3C/g%3E%3C/svg%3E"); background-size: 300px 300px; background-attachment: fixed; }
.flamingo { display: inline-block; flex: none; width: 1em; height: 1.25em; }
.flamingo svg { display: block; width: 100%; height: 100%; }
.hero-top { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 1rem; }
.hero-fl { width: clamp(4.25rem, 15vw, 7.5rem); height: auto; aspect-ratio: 64 / 80; transform-origin: 40% 100%; animation: flamingo-sway 5s ease-in-out infinite; }
@keyframes flamingo-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
h2 .h-fl { width: .8em; height: 1em; margin-right: .35em; vertical-align: -0.08em; }
.wins .mark { width: 1.15rem; height: 1.45rem; margin-top: .05rem; }
.won .won-fl { width: .9em; height: 1.1em; vertical-align: -0.2em; }
.lock-icons { display: flex; align-items: flex-end; gap: .4rem; }
.lock-fl { width: 3rem; height: 3.75rem; }
.ticket-main { position: relative; }
.ticket-fl { position: absolute; right: 1rem; bottom: .75rem; width: 2.6rem; height: 3.25rem; opacity: .9; }
.flock { display: flex; justify-content: center; align-items: flex-end; gap: 1rem; margin-top: 3rem; }
.flock .flamingo:nth-child(1) { width: 2.4rem; height: 3rem; }
.flock .flamingo:nth-child(2) { width: 3.4rem; height: 4.25rem; transform: scaleX(-1); }
.flock .flamingo:nth-child(3) { width: 2rem; height: 2.5rem; }
@media (prefers-reduced-motion: reduce) { .hero-fl { animation: none; } }

/* page links */
.site-nav { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2.5rem; }
.site-nav a { display: inline-flex; align-items: center; min-height: 2.75rem; padding: .4rem 1rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .95rem; line-height: 1.2; text-decoration: none; }
.site-nav a:hover { border-color: var(--primary); }
.site-nav a[aria-current="page"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* reports */
.foot { margin-top: 2.5rem; font-size: .95rem; color: var(--muted); }
.lock-back { justify-self: start; font-weight: 700; color: var(--accent-text); text-decoration: none; }
.lock-back:hover { text-decoration: underline; }
.banner-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.lock-fab.main { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.r-toc { margin-top: 2.5rem; padding: 1.2rem 1.4rem; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.r-toc h3 { margin: 0 0 .5rem; }
.r-toc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.r-toc a { font-weight: 700; color: var(--ink); }
.r-toc span { color: var(--muted); font-size: .95rem; }
.report { margin-top: 3.5rem; }
.report + .report { margin-top: 5rem; padding-top: 3rem; border-top: 3px dashed var(--line); }
.report-head h2 { font-size: clamp(1.7rem, 5.6vw, 2.7rem); line-height: 1.08; }
.skip { display: inline-block; margin-top: 1.1rem; font-weight: 700; color: var(--accent-text); text-underline-offset: 3px; }
.r-sec { margin-top: 3.25rem; }
.r-sec h3 { font-family: var(--display); font-weight: var(--head-weight); font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.2; color: var(--ink); margin: 0 0 1.1rem; padding-bottom: .7rem; border-bottom: 4px solid var(--primary); }
.r-sec h3 .h-fl { width: .8em; height: 1em; margin-right: .35em; vertical-align: -0.08em; }
.r-intro { font-weight: 300; font-size: 1.25rem; line-height: 1.5; margin-bottom: 1.25rem; max-width: 40rem; }
.r-paras { display: grid; gap: 1rem; max-width: 40rem; }
.r-items { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.r-items > li { padding: 1rem 1.2rem 1.1rem 1.25rem; border-left: 6px solid var(--blue); background: var(--surface); border-radius: 0 14px 14px 0; }
.r-items:not(.timeline) > li:nth-child(3n+2) { border-left-color: var(--green); }
.r-items:not(.timeline) > li:nth-child(3n) { border-left-color: var(--orange); }
.r-label { display: block; font-weight: 900; font-size: 1.1rem; line-height: 1.3; margin-bottom: .3rem; }
.r-text { display: block; }
.r-items.timeline { gap: 0; }
.r-items.timeline > li { position: relative; margin-left: .6rem; padding: 0 0 1.6rem 1.7rem; background: transparent; border-left: 3px solid var(--line); border-radius: 0; }
.r-items.timeline > li:last-child { padding-bottom: 0; border-left-color: transparent; }
.r-items.timeline > li::before { content: ""; position: absolute; left: calc(-.6rem - 1.5px); top: .2rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--bg); }
.r-items.timeline > li:nth-child(3n+2)::before { background: var(--green); }
.r-items.timeline > li:nth-child(3n)::before { background: var(--orange); }
.r-items.timeline .r-label { color: var(--accent-text); }
.r-sub { list-style: none; margin: .45rem 0 0; padding: 0; display: grid; gap: .3rem; }
.r-sub li { display: grid; grid-template-columns: 1.2rem 1fr; gap: .5rem; align-items: start; }
.r-sub li::before { content: "✓"; color: var(--green); font-weight: 900; }
.r-list { list-style: none; margin: 0; padding: 0; }
.r-list li { display: grid; grid-template-columns: auto 1fr; gap: .85rem; align-items: start; padding: .9rem 0; border-bottom: 1px solid var(--line); }
.r-list li:first-child { padding-top: 0; }
.r-list .mark { width: 1.15rem; height: 1.45rem; margin-top: .1rem; }
.r-agenda { list-style: none; margin: 0; padding: .5rem 1.5rem; border-radius: 18px; background: var(--blue); color: var(--on-blue); }
.r-agenda li { padding: 1rem 0 1rem 1.6rem; position: relative; font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.25rem); line-height: 1.4; }
.r-agenda li + li { border-top: 1px solid rgba(255,255,255,.28); }
.r-agenda li::before { content: ""; position: absolute; left: 0; top: 1.45rem; width: .65rem; height: .65rem; border-radius: 50%; background: var(--orange); }

@media print {
  :root:not(.x), :root[data-theme] { --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1F2328; --muted: #56606B; --line: #C9D1DA; --accent-text: #1E5AA8; color-scheme: light; padding: 0; }
  html, body { background: #FFFFFF !important; background-image: none !important; }
  body { font-size: 11pt; }
  .site-nav, .fab-row, .flock, .foot, .skip, .hero-fl, .banner, .r-toc { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .r-items > li, .r-list li, .r-agenda li, .r-sec h3 { break-inside: avoid; }
  .r-sec h3 { break-after: avoid; }
  .r-agenda { background: none; color: var(--ink); border: 2px solid var(--blue); }
  .r-agenda li + li { border-top-color: var(--line); }
}
</style>
</head>

  }

  /* ---------- lock screen ---------- */
  var LOCK_SVG = '<svg class="lock-icon" viewBox="0 0 56 56" aria-hidden="true"><rect x="8" y="24" width="40" height="28" rx="7" fill="#1E5AA8"/>' +
    '<path d="M17 24v-6a11 11 0 0 1 22 0v6" fill="none" stroke="#F07A1A" stroke-width="5" stroke-linecap="round"/><circle cx="28" cy="36" r="4" fill="#FFFFFF"/>' +
    '<rect x="26.5" y="37" width="3" height="8" rx="1.5" fill="#FFFFFF"/></svg>';
  function pwField(id, label, ac) {
    return '<label class="lock-field" for="' + id + '"><span>' + label + '</span><input type="password" id="' + id + '" autocomplete="' + ac +
      '" autocapitalize="off" spellcheck="false"></label>';
  }
  function showToggle(id) {
    return '<label class="lock-show"><input type="checkbox" data-show="' + id + '"> Show password</label>';
  }
  function renderLock() {
    document.title = "Private page";
    var app = document.getElementById("app"), h = '<div class="lock">';
    if (mode === "locked") h += '<a class="lock-back" href="index.html">Back to my daily list</a>';
    h += '<div class="lock-icons">' + LOCK_SVG + flamingo("lock-fl") + "</div>";
    if (!cryptoOK) {
      h += '<h1 class="lock-title">This browser can’t open locked pages.</h1><p class="lock-lede">Open the link in Chrome, Safari, Edge or Firefox.</p>';
    } else if (mode === "setup") {
      h += '<h1 class="lock-title">Lock your reports first.</h1>' +
        '<p class="lock-lede">Create a password. Your reports get scrambled, so only someone with the password can read them, even on GitHub.</p>' +
        pwField("pw1", "New password", "new-password") + pwField("pw2", "Type it again", "new-password") + showToggle("pw1,pw2") +
        '<p class="lock-hint">You can use the same password as your daily list. Write it down somewhere safe. If you forget it, nobody can open this page, not even you.</p>' +
        '<button type="button" class="lock-btn" id="lockGo" data-act="setup">Lock and download</button>';
    } else if (mode === "locked") {
      h += '<h1 class="lock-title">These reports are private.</h1><p class="lock-lede">Enter the password to open them.</p>' +
        pwField("pw", "Password", "current-password") + showToggle("pw") +
        '<button type="button" class="lock-btn" id="lockGo" data-act="unlock">Unlock</button>';
    } else {
      h += '<h1 class="lock-title">This page can’t be opened.</h1><p class="lock-lede">The file looks damaged. Upload your last downloaded copy again.</p>';
    }
    if (lockError) h += '<p class="lock-error" role="alert">' + esc(lockError) + "</p>";
    app.innerHTML = h + "</div>";
    var first = app.querySelector("input[type=password]");
    if (first) first.focus();
  }
  function busy(on, text) {
    var b = document.getElementById("lockGo");
    if (!b) return;
    b.disabled = on;
    b.textContent = text;
  }

  async function doUnlock() {
    var input = document.getElementById("pw");
    var pw = input ? input.value.trim().toLowerCase() : "";
    if (!pw) { lockError = "Type your password first."; renderLock(); return; }
    busy(true, "Opening…");
    try {
      var k = await deriveKey(pw, vault.salt, vault.iter);
      var s = await open(k, vault);
      key = k; salt = vault.salt; state = s;
    } catch (e) {
      lockError = "That password didn’t work. Check it and try again.";
      renderLock();
      return;
    }
    lockError = "";
    render();
  }

  async function doSetup() {
    var a = ((document.getElementById("pw1") || {}).value || "").trim().toLowerCase();
    var b = ((document.getElementById("pw2") || {}).value || "").trim().toLowerCase();
    if (a.length < 8) { lockError = "Use at least 8 characters. A short sentence works best."; renderLock(); return; }
    if (a !== b) { lockError = "The two passwords don’t match. Type them again."; renderLock(); return; }
    busy(true, "Locking…");
    try {
      salt = randomB64(16);
      key = await deriveKey(a, salt, ITER);
      state = JSON.parse(JSON.stringify(setupState));
      vault = await seal(state);
    } catch (e) {
      key = null; salt = null; state = null; vault = null;
      lockError = "Locking didn’t finish. Try again in Chrome, Safari, Edge or Firefox.";
      renderLock();
      return;
    }
    mode = "locked";
    download();
    banner = "Your locked page downloaded as reports.html. Upload that file to GitHub, next to index.html. Never upload this setup file.";
    lockError = "";
    render();
  }

  function lockNow() {
    key = null; salt = null; state = null; banner = "";
    renderLock();
    window.scrollTo(0, 0);
  }

  function download() {
    if (!vault) return;
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var doc = "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD + '<style id="app-style">' + css + "</style>\n</head>\n<body>\n" +
      '<main id="app" class="wrap"></main>\n' +
      "<" + SC + ' type="application/json" id="app-vault">' + JSON.stringify(vault) + "</" + SC + ">\n" +
      "<" + SC + ' id="app-script">' + js + "</" + SC + ">\n</body>\n</html>\n";
    var blob = new Blob([doc], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = FILE_NAME;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ---------- the page ---------- */
  function renderSection(s, sid) {
    var h = '<section class="r-sec" id="' + sid + '" aria-labelledby="' + sid + '-h"><h3 id="' + sid + '-h">' + flamingo("h-fl") + esc(s.title) + "</h3>";
    if (s.intro) h += '<p class="r-intro">' + esc(s.intro) + "</p>";
    if (s.kind === "text") {
      h += '<div class="r-paras">';
      (s.paras || []).forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
      h += "</div>";
    } else if (s.kind === "items") {
      h += '<ul class="r-items' + (s.style === "timeline" ? " timeline" : "") + '">';
      (s.items || []).forEach(function (it) {
        h += '<li><span class="r-label">' + esc(it.label) + "</span>";
        if (it.text) h += '<span class="r-text">' + esc(it.text) + "</span>";
        if (it.list && it.list.length) {
          h += '<ul class="r-sub">';
          it.list.forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
          h += "</ul>";
        }
        h += "</li>";
      });
      h += "</ul>";
    } else if (s.kind === "list") {
      h += '<ul class="r-list">';
      (s.items || []).forEach(function (x) { h += "<li>" + flamingo("mark") + "<span>" + esc(x) + "</span></li>"; });
      h += "</ul>";
    } else if (s.kind === "agenda") {
      h += '<ul class="r-agenda">';
      (s.items || []).forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
      h += "</ul>";
    }
    return h + "</section>";
  }

  function renderReport(r) {
    var rid = esc(r.id), sections = r.sections || [], agenda = -1;
    sections.forEach(function (s, i) { if (s.kind === "agenda") agenda = i; });
    var h = '<article class="report" id="' + rid + '" aria-labelledby="' + rid + '-h"><header class="report-head">';
    h += '<p class="date">' + esc(r.date) + (r.by ? " · " + esc(r.by) : "") + "</p>";
    h += '<h2 id="' + rid + '-h">' + esc(r.title) + "</h2>";
    if (r.subtitle) h += '<p class="kicker">' + esc(r.subtitle) + "</p>";
    if (agenda > -1) h += '<a class="skip" href="#' + rid + "-s" + agenda + '">Jump to ' + esc(sections[agenda].title.charAt(0).toLowerCase() + sections[agenda].title.slice(1)) + "</a>";
    h += "</header>";
    sections.forEach(function (s, i) { h += renderSection(s, rid + "-s" + i); });
    return h + "</article>";
  }

  function render() {
    if (!state || !key) { renderLock(); return; }
    var app = document.getElementById("app");
    var reports = state.reports || [];
    document.title = PAGE_TITLE;
    var h = siteNav(FILE_NAME);
    if (banner) {
      h += '<div class="banner" role="status"><strong>' + esc(banner) + '</strong><div class="banner-actions">' +
        '<button type="button" data-act="download">Download again</button><button type="button" data-act="banner-off">Got it</button></div></div>';
    }
    h += '<header class="hero"><div class="hero-top"><h1>' + esc(PAGE_TITLE) + "</h1>" + flamingo("hero-fl") + "</div>" +
      '<p class="kicker">Notes to bring to my sessions.</p></header>';
    if (reports.length > 1) {
      h += '<nav class="r-toc" aria-label="All reports"><h3>All reports</h3><ul>';
      reports.forEach(function (r) { h += '<li><a href="#' + esc(r.id) + '">' + esc(r.title) + "</a> <span>" + esc(r.date) + "</span></li>"; });
      h += "</ul></nav>";
    }
    if (!reports.length) h += '<p class="r-intro r-empty">No reports yet.</p>';
    reports.forEach(function (r) { h += renderReport(r); });
    h += '<div class="flock" aria-hidden="true">' + flamingo() + flamingo() + flamingo() + "</div>";
    h += '<p class="foot">Tap Lock when you’re done.</p>';
    h += '<div class="fab-row"><button type="button" class="lock-fab" data-act="print">Print</button>' +
      '<button type="button" class="lock-fab main" data-act="lock">Lock</button></div>';
    app.innerHTML = h;
  }

  /* ---------- clicks and keys ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
    var act = t && t.getAttribute("data-act");
    if (act === "unlock") doUnlock();
    else if (act === "setup") doSetup();
    else if (!state) return;
    else if (act === "lock") lockNow();
    else if (act === "print") window.print();
    else if (act === "download") download();
    else if (act === "banner-off") { banner = ""; render(); }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute("data-show")) {
      t.getAttribute("data-show").split(",").forEach(function (id) {
        var f = document.getElementById(id);
        if (f) f.type = t.checked ? "text" : "password";
      });
    }
  });
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (ev.key !== "Enter" || !t || !t.id) return;
    if (t.id === "pw") { ev.preventDefault(); doUnlock(); }
    else if (t.id === "pw1" || t.id === "pw2") { ev.preventDefault(); doSetup(); }
  });

  renderLock();
})();
</script>
</body>
</html>
