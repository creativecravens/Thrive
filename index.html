<!doctype html>
<html lang="en">
<head>

<style id="app-style">
:root {
  --blue: #1E5AA8;
  --green: #1F8A5B;
  --orange: #F07A1A;
  --on-blue: #FFFFFF;
  --on-green: #FFFFFF;
  --on-orange: #1F2328;
  --primary: var(--blue);
  --on-primary: var(--on-blue);
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --ink: #1F2328;
  --muted: #56606B;
  --line: #DCE2E9;
  --accent-text: #1E5AA8;
  --display: "Logo Code", "LogoCode", "Logo Code Regular", "Orbitron", "Arial Black", system-ui, sans-serif;
  --text: "Lato", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --head-weight: 900;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161B;
    --surface: #1B2027;
    --ink: #E8ECF1;
    --muted: #A3ADB9;
    --line: #2C333C;
    --accent-text: #F07A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161B;
  --surface: #1B2027;
  --ink: #E8ECF1;
  --muted: #A3ADB9;
  --line: #2C333C;
  --accent-text: #F07A1A;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 1.125rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 8rem; }

/* type scale */
h1, h2, h3 { font-family: var(--display); margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.3rem, 8vw, 4.6rem); font-weight: var(--head-weight); line-height: 1.02; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.45rem, 4.6vw, 2.2rem); font-weight: var(--head-weight); line-height: 1.1; }
h3 { font-size: 1rem; font-weight: 700; line-height: 1.3; color: var(--accent-text); margin: 2rem 0 .4rem; }
.kicker { font-weight: 300; font-style: italic; font-size: 1.15rem; color: var(--muted); margin-top: .4rem; }
.sec-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 1rem; margin-bottom: 1.25rem; padding-bottom: .9rem; border-bottom: 4px solid var(--primary); }
.sec-count { font-family: var(--display); font-weight: var(--head-weight); font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1; color: var(--ink); text-align: right; }
.sec-count small { display: block; font-family: var(--text); font-weight: 700; font-size: .85rem; color: var(--muted); margin-top: .3rem; }

/* hero */
.date { font-weight: 700; font-size: 1rem; color: var(--accent-text); margin-bottom: .9rem; }
.intro { margin-top: 1.25rem; font-size: clamp(1.2rem, 3vw, 1.45rem); font-weight: 300; line-height: 1.45; max-width: 38rem; }
.reminder { margin-top: 2rem; padding: 1.25rem 1.4rem 1.35rem; background: var(--blue); color: var(--on-blue); border-radius: 16px; }
.reminder-label { display: block; font-weight: 700; font-size: .95rem; opacity: .9; }
.reminder-text { display: block; margin-top: .25rem; font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 1.7rem); line-height: 1.3; }
.countdown { display: inline-block; margin-top: 1rem; padding: .35rem .9rem; border-radius: 999px; background: var(--orange); color: var(--on-orange); font-weight: 900; }

section { margin-top: 4rem; }

/* who I am */
.identity { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.identity li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .75rem; padding: 1rem 1rem 1rem 1.25rem; border-left: 6px solid var(--blue); background: var(--surface); border-radius: 0 14px 14px 0; font-weight: 900; font-size: clamp(1.15rem, 3vw, 1.4rem); line-height: 1.35; }

/* notes */
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
.note { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: center; padding: 1.4rem 1.25rem 1.5rem 1.5rem; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.note.promise { background: var(--green); color: var(--on-green); border-color: var(--green); }
.note-tag { display: block; font-weight: 700; font-size: .95rem; margin-bottom: .35rem; }
.note.promise .note-tag { opacity: .9; }
.note-text { display: block; font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.note.promise .note-text { font-family: var(--display); font-weight: var(--head-weight); font-size: clamp(1.35rem, 4.4vw, 2rem); line-height: 1.15; }
.note.promise .del { color: var(--on-green); border-color: rgba(255,255,255,.55); }

/* wins */
.wins { list-style: none; margin: 0; padding: 0; }
.wins li { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: .85rem; padding: .85rem 0; border-bottom: 1px solid var(--line); font-size: 1.2rem; line-height: 1.4; }
.mark { color: var(--green); font-size: 1rem; line-height: 1.7; }

/* checklists */
.goals { list-style: none; margin: 0; padding: 0; }
.goal { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.goal label, .goal-main { display: flex; align-items: flex-start; gap: .85rem; line-height: 1.4; padding: .15rem 0; min-width: 0; }
.goal label { cursor: pointer; }
.goal input[type="checkbox"] { width: 1.4rem; height: 1.4rem; margin: .05rem 0 0; flex: none; cursor: pointer; accent-color: var(--orange); }
.daily .goal input[type="checkbox"] { accent-color: var(--green); }
.goal.done .goal-text { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.towin { font: inherit; font-size: .85rem; font-weight: 700; padding: .3rem .8rem; border-radius: 999px; border: 2px solid var(--green); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.towin:hover { background: var(--green); color: var(--on-green); }
.won { font-size: .85rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: .5rem; }
.bar span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--orange); transition: width .45s ease; }
.daily .bar span { background: var(--green); }

/* joys */
.joys { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .55rem; }
.joys li { display: inline-flex; align-items: center; gap: .5rem; padding: .4rem 1rem; border: 2px solid var(--blue); border-radius: 999px; background: var(--surface); line-height: 1.3; font-weight: 700; }
.joys li:nth-child(3n+2) { border-color: var(--green); }
.joys li:nth-child(3n) { border-color: var(--orange); }
.editing .joys li { padding-right: .4rem; }

/* dream ticket */
.ticket { margin-top: 2.5rem; position: relative; display: grid; grid-template-columns: 1fr auto; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; background: var(--bg); z-index: 1; }
.ticket::before { left: -13px; }
.ticket::after { right: -13px; }
.ticket-main { background: var(--blue); color: var(--on-blue); padding: 1.6rem 1.75rem 1.7rem; border-radius: 18px 0 0 18px; min-width: 0; }
.ticket-label { font-weight: 700; font-size: .95rem; opacity: .9; }
.ticket-title { font-family: var(--display); font-weight: var(--head-weight); font-size: clamp(1.5rem, 6.2vw, 2.8rem); line-height: 1; margin-top: .35rem; overflow-wrap: anywhere; }
.ticket-place { font-weight: 300; font-size: 1.3rem; margin-top: .2rem; }
.ticket-tier { font-weight: 900; font-size: 1.1rem; margin-top: 1rem; }
.ticket-sub { font-style: italic; font-weight: 300; margin-top: .15rem; }
.ticket-stub { background: var(--orange); color: var(--on-orange); border-left: 2px dashed rgba(31,35,40,.55); padding: 1.5rem 1.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .2rem; border-radius: 0 18px 18px 0; }
.stub-label { font-weight: 700; font-size: .85rem; }
.stub-tier { font-family: var(--display); font-weight: var(--head-weight); font-size: 1.55rem; line-height: 1.05; }
.stub-admit { font-size: .85rem; font-weight: 700; margin-top: .2rem; }
@media (max-width: 32rem) {
  .ticket { grid-template-columns: 1fr; }
  .ticket::before, .ticket::after { display: none; }
  .ticket-main { border-radius: 18px 18px 0 0; }
  .ticket-stub { border-left: 0; border-top: 2px dashed rgba(31,35,40,.55); border-radius: 0 0 18px 18px; flex-direction: row; justify-content: space-between; flex-wrap: wrap; padding: 1rem 1.75rem 1.15rem; text-align: left; }
}
.tiers { list-style: none; margin: .5rem 0 0; padding: 0; display: grid; gap: .6rem; }
.tier { font: inherit; width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: start; padding: 1rem 1.2rem; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tier:hover { border-color: var(--blue); }
.tier[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 6px 0 0 var(--green); }
.tier-level { font-weight: 700; font-size: .9rem; color: var(--muted); }
.tier-name { grid-column: 1; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.tier-desc { grid-column: 1 / -1; color: var(--muted); }
.tier-pick { grid-column: 2; grid-row: 1 / 3; align-self: center; font-weight: 900; font-size: .9rem; white-space: nowrap; }
.tier[aria-pressed="true"] .tier-pick::before { content: "✓ "; color: var(--green); }

/* edit mode */
.edit-text { border-radius: 6px; outline: 2px dashed transparent; outline-offset: 3px; cursor: text; }
.editing .edit-text { outline-color: color-mix(in srgb, var(--primary) 55%, transparent); }
.editing .edit-text:focus { outline: 2px solid var(--orange); }
.note.promise .edit-text, .reminder .edit-text { outline-color: rgba(255,255,255,.6); }
.del { font: inherit; flex: none; font-size: .85rem; font-weight: 700; padding: .3rem .75rem; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.del:hover { color: var(--ink); border-color: var(--ink); }
.del.pending { color: var(--ink); border-color: var(--orange); background: color-mix(in srgb, var(--orange) 18%, transparent); }
.add { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.add input, .add select { font: inherit; font-size: 1rem; min-height: 2.75rem; padding: 0 .85rem; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.add input { flex: 1 1 14rem; min-width: 0; }
.add input::placeholder { color: var(--muted); opacity: 1; }
.add button { font: inherit; font-size: 1rem; font-weight: 900; min-height: 2.75rem; padding: 0 1.2rem; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); cursor: pointer; }

.edit-fab { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 20; font: inherit; font-weight: 900; font-size: 1rem; padding: .8rem 1.3rem; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-primary); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 3px solid var(--primary); padding: .85rem 1rem calc(.85rem + env(safe-area-inset-bottom, 0px)); }
.editbar-inner { max-width: 46rem; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
.editbar-text { flex: 1 1 16rem; font-size: .95rem; line-height: 1.4; }
.editbar-text strong { display: block; font-family: var(--display); font-weight: var(--head-weight); font-size: 1.05rem; }
.editbar-text span { color: var(--muted); }
.editbar-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.bar-btn { font: inherit; font-size: .95rem; font-weight: 700; min-height: 2.6rem; padding: 0 1rem; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.bar-btn.main { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.bar-btn.pending { border-color: var(--orange); }

/* make it yours */
.style-panel { margin-top: 4rem; padding: 1.5rem; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 1.25rem; }
.style-panel h2 { font-size: 1.3rem; }
.ctl-label { display: block; font-weight: 700; font-size: .95rem; color: var(--muted); margin-bottom: .45rem; }
.swatches { display: flex; flex-wrap: wrap; gap: .6rem; }
.swatch { font: inherit; display: inline-flex; align-items: center; gap: .6rem; padding: .4rem 1rem .4rem .4rem; border: 2px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); font-weight: 700; cursor: pointer; }
.swatch .dot { width: 1.8rem; height: 1.8rem; border-radius: 50%; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 1rem; border: 0; padding: .55rem 1rem; background: var(--bg); color: var(--ink); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 900; }
.foot { margin-top: 2.5rem; font-size: .95rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

/* lock screen */
.lock { min-height: 78vh; max-width: 28rem; margin: 0 auto; display: grid; align-content: center; gap: 1.1rem; }
.lock-icon { width: 3.5rem; height: 3.5rem; }
.lock-title { font-size: clamp(1.9rem, 6.5vw, 2.7rem); font-weight: var(--head-weight); line-height: 1.08; }
.lock-lede { font-size: 1.2rem; font-weight: 300; line-height: 1.45; }
.lock-field { display: grid; gap: .35rem; }
.lock-field span { font-weight: 700; font-size: .95rem; color: var(--muted); }
.lock-field input { font: inherit; font-size: 1.15rem; min-height: 3.1rem; padding: 0 1rem; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: 100%; }
.lock-field input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
.lock-show { display: flex; align-items: center; gap: .6rem; font-size: 1rem; cursor: pointer; }
.lock-show input { width: 1.2rem; height: 1.2rem; accent-color: var(--blue); }
.lock-hint { color: var(--muted); font-size: 1rem; line-height: 1.5; }
.lock-btn { font: inherit; font-size: 1.1rem; font-weight: 900; min-height: 3.2rem; border: 0; border-radius: 12px; background: var(--blue); color: var(--on-blue); cursor: pointer; }
.lock-btn[disabled] { opacity: .7; cursor: progress; }
.lock-error { padding: .7rem .9rem; border-left: 5px solid var(--orange); border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--orange) 15%, transparent); font-weight: 700; }

/* after setup */
.banner { margin-bottom: 2.5rem; padding: 1.25rem 1.4rem; border-radius: 16px; background: var(--green); color: var(--on-green); display: grid; gap: .75rem; }
.banner strong { font-family: var(--display); font-weight: var(--head-weight); font-size: 1.25rem; line-height: 1.2; }
.banner button { justify-self: start; font: inherit; font-weight: 900; padding: .5rem 1.1rem; border-radius: 10px; border: 2px solid var(--on-green); background: transparent; color: var(--on-green); cursor: pointer; }

/* floating buttons */
.fab-row { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: .5rem; }
.fab-row .edit-fab { position: static; }
.lock-fab { font: inherit; font-weight: 900; font-size: 1rem; padding: .8rem 1.2rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* password panel */
.pw-panel { display: grid; gap: .75rem; }
.pw-panel .lock-field input { min-height: 2.75rem; font-size: 1rem; }
.pw-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.pw-msg { font-weight: 700; }
</style>
</head>

<script id="app-script">
(function () {
  "use strict";
  var STORE_KEY = "my-daily-list-locked";
  var OLD_KEYS = ["my-daily-list", "my-daily-list-v1", "my-daily-list-drafts"];
  var ITER = 600000;
  var SC = "scr" + "ipt";
  var HEAD = '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<meta name="robots" content="noindex, nofollow, noarchive">\n' +
    '<title>Private page</title>\n' +
    '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ctext y=\'.9em\' font-size=\'90\'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">\n' +

    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">\n';
  var ACCENTS = [["blue", "Blue", "#1E5AA8", "#FFFFFF"], ["green", "Green", "#1F8A5B", "#FFFFFF"], ["orange", "Orange", "#F07A1A", "#1F2328"]];
  var WEIGHTS = [["500", "Regular"], ["700", "Bold"], ["900", "Heavy"]];
  var LISTS = ["identity", "notes", "wins", "daily", "joys", "goals"];
  var enc = new TextEncoder(), dec = new TextDecoder();
  var cryptoOK = !!(window.crypto && window.crypto.subtle);

  /* ---------- what this file contains ---------- */
  var vault = null, setupState = null;
  try { var ve = document.getElementById("app-vault"); if (ve) vault = JSON.parse(ve.textContent); } catch (e) { vault = null; }
  try { var pe = document.getElementById("app-state"); if (!vault && pe) setupState = JSON.parse(pe.textContent); } catch (e) { setupState = null; }
  var mode = vault ? "locked" : (setupState ? "setup" : "broken");

  /* ---------- session (cleared on lock) ---------- */
  var key = null, salt = null, state = null;
  var embeddedState = null, embeddedKey = null, embeddedSalt = null, publishedNorm = null, pwChanged = false;
  var editing = false, pendingRemove = null, pendingDiscard = false, saveTimer = null, saveSeq = 0;
  var banner = "", lockError = "", pwOpen = false, pwMsg = "", pwError = "";

  /* ---------- crypto ---------- */
  function b64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function unb64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function randomB64(n) { return b64(crypto.getRandomValues(new Uint8Array(n))); }
  async function deriveKey(pw, saltB64, iter) {
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter || ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(JSON.stringify(obj)));
    return { kdf: "PBKDF2-SHA256", iter: ITER, salt: salt, iv: b64(iv), ct: b64(ct) };
  }
  async function open(k, v) {
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.iv) }, k, unb64(v.ct));
    return JSON.parse(dec.decode(pt));
  }

  /* ---------- helpers ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function fill(s) {
    LISTS.forEach(function (k) { s[k] = s[k] || []; });
    s.groups = s.groups || ["Other"];
    s.style = s.style || { accent: "blue", weight: "900" };
    s.copy = s.copy || {};
    return s;
  }
  function normalize(s) {
    var c = clone(s);
    delete c.updatedAt;
    (c.daily || []).forEach(function (d) { d.day = ""; });
    return JSON.stringify(c);
  }
  function unsynced() { return pwChanged || publishedNorm === null || normalize(state) !== publishedNorm; }
  function readLocal() { try { var r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function clearOldKeys() { OLD_KEYS.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); }
  function saveLocal() {
    if (!key || !state) return;
    var mine = ++saveSeq;
    seal(state).then(function (v) {
      if (mine !== saveSeq || !key) return;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) {}
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayLabel() {
    try { return new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); } catch (e) { return ""; }
  }
  function dayNumber() { var n = new Date(); return Math.floor(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 86400000); }
  function todayKey() { var n = new Date(); return n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate(); }
  function halloweenLine() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var n = Math.round((new Date(now.getFullYear(), 9, 31) - today) / 86400000);
    if (n === 0) return "Happy Halloween!";
    if (n === 1) return "Tomorrow is Halloween.";
    if (n > 1 && n <= 45) return n + " nights until Halloween";
    return "";
  }
  function applyStyle() {
    var root = document.documentElement, st = (state && state.style) || { accent: "blue", weight: "900" }, a = ACCENTS[0];
    ACCENTS.forEach(function (x) { if (x[0] === st.accent) a = x; });
    root.style.setProperty("--primary", a[2]);
    root.style.setProperty("--on-primary", a[3]);
    root.style.setProperty("--head-weight", st.weight || "900");
  }

  /* ---------- lock screen ---------- */
  var LOCK_SVG = '<svg class="lock-icon" viewBox="0 0 56 56" aria-hidden="true"><rect x="8" y="24" width="40" height="28" rx="7" fill="#1E5AA8"/>' +
    '<path d="M17 24v-6a11 11 0 0 1 22 0v6" fill="none" stroke="#F07A1A" stroke-width="5" stroke-linecap="round"/><circle cx="28" cy="36" r="4" fill="#FFFFFF"/>' +
    '<rect x="26.5" y="37" width="3" height="8" rx="1.5" fill="#FFFFFF"/></svg>';
  function pwField(id, label, ac) {
    return '<label class="lock-field" for="' + id + '"><span>' + label + '</span><input type="password" id="' + id + '" autocomplete="' + ac +
      '" autocapitalize="off" spellcheck="false"></label>';
  }
  function showToggle(id) {
    return '<label class="lock-show"><input type="checkbox" data-show="' + id + '"> Show password</label>';
  }
  function renderLock() {
    document.title = "Private page";
    document.body.classList.remove("editing");
    applyStyle();
    var app = document.getElementById("app"), h = '<div class="lock">' + LOCK_SVG;
    if (!cryptoOK) {
      h += '<h1 class="lock-title">This browser can’t open locked pages.</h1><p class="lock-lede">Open the link in Chrome, Safari, Edge or Firefox.</p>';
    } else if (mode === "setup") {
      h += '<h1 class="lock-title">Lock your page first.</h1>' +
        '<p class="lock-lede">Create a password. Your page gets scrambled, so only someone with the password can read it, even on GitHub.</p>' +
        pwField("pw1", "New password", "new-password") + pwField("pw2", "Type it again", "new-password") + showToggle("pw1,pw2") +
        '<p class="lock-hint">Use 4 or more words you’ll remember, like a short sentence. Write it down somewhere safe. If you forget it, nobody can open the page, not even you.</p>' +
        '<button type="button" class="lock-btn" id="lockGo" data-act="setup">Lock and download</button>';
    } else if (mode === "locked") {
      h += '<h1 class="lock-title">This page is private.</h1><p class="lock-lede">Enter the password to open it.</p>' +
        pwField("pw", "Password", "current-password") + showToggle("pw") +
        '<button type="button" class="lock-btn" id="lockGo" data-act="unlock">Unlock</button>';
    } else {
      h += '<h1 class="lock-title">This page can’t be opened.</h1><p class="lock-lede">The file looks damaged. Upload your last downloaded copy again.</p>';
    }
    if (lockError) h += '<p class="lock-error" role="alert">' + esc(lockError) + "</p>";
    app.innerHTML = h + "</div>";
    var first = app.querySelector("input[type=password]");

    var input = document.getElementById("pw");
    var pw = input ? input.value : "";
    if (!pw) { lockError = "Type your password first."; renderLock(); return; }
    busy(true, "Opening…");
    var ok = null;
    try {
      var k = await deriveKey(pw, vault.salt, vault.iter);
      var s = await open(k, vault);
      ok = { k: k, salt: vault.salt, state: s };
      embeddedState = clone(s); embeddedKey = k; embeddedSalt = vault.salt; publishedNorm = normalize(s);
    } catch (e) { ok = null; }

    if (local && local.ct) {
      try {
        var lk = (ok && local.salt === ok.salt) ? ok.k : await deriveKey(pw, local.salt, local.iter);
        var ls = await open(lk, local);
        if (!ok || (ls.v === ok.state.v && (ls.updatedAt || 0) > (ok.state.updatedAt || 0))) {
          if (!ok) publishedNorm = null;
          if (local.salt !== vault.salt) pwChanged = true;
          ok = { k: lk, salt: local.salt, state: ls };
        }
      } catch (e) {}
    }
    if (!ok) {
      lockError = "That password didn’t work. Check it and try again.";
      renderLock();
      return;
    }
    key = ok.k; salt = ok.salt; state = fill(ok.state);
    lockError = "";
    clearOldKeys();
    render({});
  }

    if (a !== b) { lockError = "The two passwords don’t match. Type them again."; renderLock(); return; }
    busy(true, "Locking…");
    salt = randomB64(16);
    key = await deriveKey(a, salt, ITER);

    state.updatedAt = Date.now();
    clearOldKeys();
    vault = await seal(state);

    mode = "locked";
    await download();
    saveLocal();
    banner = "Your locked page downloaded as index.html. Upload that file to GitHub. Never upload this setup file.";
    lockError = "";
    render({});
  }

      var x = findIn("daily", t.getAttribute("data-id"));
      if (x) { x.day = t.checked ? todayKey() : ""; commit(); }
    }
  });

  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (ev.key === "Enter" && t && t.type === "password" || (ev.key === "Enter" && t && t.id && /^(pw|pw1|pw2|np1|np2)$/.test(t.id))) {
      ev.preventDefault();
      if (t.id === "pw") doUnlock();
      else if (t.id === "pw1" || t.id === "pw2") doSetup();
      else changePassword();
      return;
    }
    if (t && t.hasAttribute && t.hasAttribute("data-edit-list")) {
      if (ev.key === "Enter") { ev.preventDefault(); t.blur(); }
      else if (ev.key === "Escape") { t.textContent = t.getAttribute("data-orig") || t.textContent; t.blur(); }
      return;
    }
    if (ev.key === "Enter" && t && t.getAttribute && t.getAttribute("data-add")) { ev.preventDefault(); addFrom(t.getAttribute("data-add")); }
    if (ev.key === "Escape" && (pendingRemove || pendingDiscard)) { pendingRemove = null; pendingDiscard = false; render(); }
  });

  renderLock();
})();
</script>
</body>
</html>
